version: "3.8"

services:
  igbot:
    build: .
    container_name: igbot
    # limite di memoria: se lo supera il container si riavvia invece di saturare lo swap del Raspberry
    mem_limit: 384m
    memswap_limit: 512m   # RAM + swap massimi
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - igbot_data:/data
    environment:
      CHECK_INTERVAL: "60"
      DEFAULT_RSS: "https://www.montagneepaesi.com/feed/"
      HUB_LINK: "www.montagneepaesi.com/instagram"
      WA_CHANNEL_URL: "https://whatsapp.com/channel/0029Vb7fcHT8aKvFAuCIfm0c"
      NATIONAL_FILLER_GAP: "1800"   # notizie d'agenzia: al massimo una ogni 30 minuti quando mancano le locali

volumes:
  igbot_data:
